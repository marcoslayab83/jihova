[phases.setup]
nixPkgs = [
    "php83",
    "php83Packages.composer",
    "nodejs_22",
    "php83Extensions.pdo_mysql",
    "php83Extensions.pdo_sqlite",
    "php83Extensions.gd",
    "php83Extensions.zip",
    "php83Extensions.bcmath",
    "php83Extensions.intl",
    "php83Extensions.opcache",
    "php83Extensions.pcntl"
]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm install"
]

[phases.build]
cmds = [
    "npm run build"
]

[start]
cmd = "php artisan storage:link --force && ( [ \"$RUN_MIGRATIONS\" = \"true\" ] && php artisan migrate --force --seed || true ) && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=80"
